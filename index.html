<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10131a">
    <meta name="description" content="A simple, accessible calculator for everyday arithmetic.">
    <title>Calculator</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <header class="calculator__header">
        <p class="calculator__eyebrow">Everyday tools</p>
        <h1>Calculator</h1>
      </header>

      <section class="calculator__display" aria-label="Display">
        <p class="calculator__expression" id="expression" aria-hidden="true"></p>
        <output class="calculator__result" id="display" aria-live="polite" aria-atomic="true">0</output>
      </section>

      <section class="calculator__keys" aria-label="Calculator keys">
        <button class="key key--utility" type="button" data-action="clear" aria-label="Clear">AC</button>
        <button class="key key--utility" type="button" data-action="sign" aria-label="Change sign">+/-</button>
        <button class="key key--utility" type="button" data-action="percent" aria-label="Percent">%</button>
        <button class="key key--operator" type="button" data-operator="divide" aria-label="Divide">÷</button>

        <button class="key" type="button" data-digit="7">7</button>
        <button class="key" type="button" data-digit="8">8</button>
        <button class="key" type="button" data-digit="9">9</button>
        <button class="key key--operator" type="button" data-operator="multiply" aria-label="Multiply">×</button>

        <button class="key" type="button" data-digit="4">4</button>
        <button class="key" type="button" data-digit="5">5</button>
        <button class="key" type="button" data-digit="6">6</button>
        <button class="key key--operator" type="button" data-operator="subtract" aria-label="Subtract">−</button>

        <button class="key" type="button" data-digit="1">1</button>
        <button class="key" type="button" data-digit="2">2</button>
        <button class="key" type="button" data-digit="3">3</button>
        <button class="key key--operator" type="button" data-operator="add" aria-label="Add">+</button>

        <button class="key key--utility" type="button" data-action="delete" aria-label="Delete last digit">⌫</button>
        <button class="key key--zero" type="button" data-digit="0">0</button>
        <button class="key" type="button" data-action="decimal" aria-label="Decimal point">.</button>
        <button class="key key--equals" type="button" data-action="equals" aria-label="Equals">=</button>
      </section>
      <p class="calculator__hint">Keyboard: 0–9, +, −, *, /, Enter, Backspace, Esc</p>
    </main>
  </body>
</html>
